name: WebView official channel check

# Runs the webviewpatch locator against the current Google-signed Android System WebView of the Stable,
# Beta and Canary channels, as an early warning that a new WebView may stop patching. The builds come from
# the private repo hazptr/webview-builds (kept current by a maintainer's fetcher, straight from Google Play,
# fully apksigner-verified there); this job reads them with a fine-grained, Contents:Read-only token and
# verifies each asset's SHA-256 against the manifest. A failure means a verified official build was fetched
# and the locator did not find the X-Requested-With adder in it. Without the token (fork PRs, or not yet
# configured) the job skips with a notice and passes. See CONTRIBUTING.md.

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  pull_request:
    paths:
      - modules/webviewpatch/**
      - .github/workflows/webview-official.yml
      - .github/scripts/webview-official-check.sh

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Locate the adder in the official channels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # The private-builds token is passed to this one step only. The assets live on GitHub's own release
      # storage (same network as the runner), so each run re-downloads the current builds; no cache. The
      # script skips with a notice (job passes) when the secret is absent, as on fork PRs.
      - name: Fetch, verify and locate the adder
        env:
          WEBVIEW_BUILDS_TOKEN: ${{ secrets.WEBVIEW_BUILDS_TOKEN }}
        run: |
          OUTDIR="$GITHUB_WORKSPACE/.official-libs" bash .github/scripts/webview-official-check.sh

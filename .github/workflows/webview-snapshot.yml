name: WebView snapshot check

# Runs the webviewpatch locator against the latest published Chromium *snapshot* WebView, as an early
# warning that a future WebView may stop patching. A failure means: this snapshot would not patch.
# It is a smoke signal, not proof the Google-signed Play WebView patches — see CONTRIBUTING.md.

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  pull_request:
    paths:
      - modules/webviewpatch/**
      - .github/workflows/webview-snapshot.yml
      - .github/scripts/webview-snapshot-check.sh

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Locate the adder in the latest snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Resolve the latest snapshot builds
        id: builds
        env:
          BASE: https://storage.googleapis.com/chromium-browser-snapshots
        run: |
          arm64=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$BASE/Android_Arm64/LAST_CHANGE")
          android=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 "$BASE/Android/LAST_CHANGE")
          case "$arm64" in (''|*[!0-9]*) echo "bad Android_Arm64 LAST_CHANGE: '$arm64'"; exit 1 ;; esac
          case "$android" in (''|*[!0-9]*) echo "bad Android LAST_CHANGE: '$android'"; exit 1 ;; esac
          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "Android_Arm64=$arm64 (gate), Android=$android (info)"

      - name: Cache the extracted snapshot libs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .snapshot-libs
          key: webview-snapshot-${{ steps.builds.outputs.arm64 }}-${{ steps.builds.outputs.android }}

      - name: Locate the adder
        env:
          WORKDIR: ${{ github.workspace }}/.snapshot-libs
        run: |
          bash .github/scripts/webview-snapshot-check.sh \
            --build-arm64 "${{ steps.builds.outputs.arm64 }}" \
            --build-android "${{ steps.builds.outputs.android }}"

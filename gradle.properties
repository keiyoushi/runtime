org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true

# The app provides the Kotlin stdlib to every extension
kotlin.stdlib.default.dependency=false

# Where the runtime's update store lives: the `repo` branch, written by release.yml
runtime.storeBaseUrl=https://raw.githubusercontent.com/keiyoushi/runtime/repo

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4096m
org.gradle.parallel=true

# The app provides the Kotlin stdlib to every extension
kotlin.stdlib.default.dependency=false

# The runtime's update store: the v2 index on the `repo` branch, written by release.yml
runtime.storeUrl=https://github.com/keiyoushi/runtime/raw/repo/index.pb
